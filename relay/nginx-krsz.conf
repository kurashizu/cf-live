# KRSZ Live on port 80, for bare-IP requests only.
#
# The existing site keeps port 80 for its own server_name and continues to
# redirect to HTTPS. This block is default_server, so it answers only
# requests that match no other server_name -- which is what a bare-IP
# request does. Nothing about that site changes.
#
# Plain HTTP on purpose: this is a bare IP, so a certificate is impossible,
# and AVPro in VRChat is happy with HTTP.
server {
    listen 80 default_server;
    server_name _;

    # Playback only. This host relays what Sydney sends; it is not an
    # ingest endpoint, so there is no /ingest/ route to reach.
    location / {
        proxy_pass http://127.0.0.1:9990;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # A cached playlist freezes the stream: the player re-reads identical
        # bytes, concludes there is nothing new, and stops fetching. The
        # relay sets its own Cache-Control per path (no-store for playlists,
        # immutable for segments); nginx must not override or add to it.
        proxy_buffering off;
        proxy_cache off;

        # Segments arrive as they are recovered, so a slow first byte is
        # normal while a block is still being reassembled.
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Keep the access log quiet: a handful of viewers polling twice a second
    # would otherwise fill the disk on a small box.
    access_log off;
}

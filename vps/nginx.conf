# KRSZ Live on a VPS: nginx receives HLS segments from OBS and serves them.
#
# Replaces the Worker + Durable Object version. Everything the Worker had to
# implement by hand — a ring buffer, eviction, media-sequence bookkeeping — is
# handled here by ffmpeg writing files and nginx serving them.
#
# Install to /etc/nginx/conf.d/cf-live.conf (or sites-available + a symlink),
# then: nginx -t && systemctl reload nginx

# Ingest key. Must match the OBS URL and the INGEST_KEY you used before.
# Change this to a long random string.
map $uri $unused_ingest_note { default ""; }

server {
    listen 127.0.0.1:8080;        # cloudflared reaches nginx here only
    server_name _;

    # Segments live in RAM. They are written once, read for a few seconds and
    # then deleted, so putting them on disk only wears out a cheap VPS.
    root /dev/shm/cf-live;

    # A dropped upload should not kill a long broadcast.
    client_max_body_size 32m;
    client_body_timeout 30s;

    # ---- ingest -------------------------------------------------------------
    # OBS's FFmpeg output PUTs each segment and rewrites the playlist. The key
    # is embedded in the path, exactly as the Worker version did, so the OBS
    # configuration carries over unchanged.
    location ~ ^/ingest/(?<key>[^/]+)/(?<stream>[A-Za-z0-9._-]+)/(?<file>[A-Za-z0-9._-]+)$ {
        # Reject anything but the configured key. Keep this in sync with OBS.
        if ($key != "CHANGE_ME_INGEST_KEY") { return 403; }

        alias /dev/shm/cf-live/$stream/$file;

        dav_methods PUT DELETE;
        dav_access user:rw group:r all:r;
        create_full_put_path on;

        # ffmpeg sends a PUT per segment and per playlist refresh; no caching.
        add_header Cache-Control "no-store" always;
        limit_except PUT DELETE { deny all; }
    }

    # ---- playback -----------------------------------------------------------
    # /<stream> and /<stream>.m3u8 both return a master playlist, because
    # players in the VRChat ecosystem expect to be handed one — AVPro reads
    # codec hints from EXT-X-STREAM-INF before committing to a rendition, and
    # given a bare media playlist some builds sit in a loading state.
    location ~ ^/(?<stream>[A-Za-z0-9._-]+?)(\.m3u8)?$ {
        # Reserved names must not be shadowed by a stream.
        if ($stream ~* ^(healthz|live|ingest|index\.html|favicon\.ico|robots\.txt)$) {
            return 404;
        }
        default_type application/vnd.apple.mpegurl;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
        # BANDWIDTH=1 with no CODECS mirrors SRS, whose output is known to play
        # where a fuller declaration did not.
        return 200 "#EXTM3U\n#EXT-X-VERSION:3\n#EXT-X-STREAM-INF:BANDWIDTH=1,AVERAGE-BANDWIDTH=1\n/live/$stream/index.m3u8\n";
    }

    # The media playlist ffmpeg maintains. Must never be cached: a player that
    # reuses a stale copy sees the stream frozen. Plain no-store rather than
    # no-cache + must-revalidate, which Cloudflare strips on the way out.
    location ~ ^/live/(?<stream>[A-Za-z0-9._-]+)/index\.m3u8$ {
        alias /dev/shm/cf-live/$stream/live.m3u8;
        default_type application/vnd.apple.mpegurl;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
        # Fall back to the offline slate when nobody is broadcasting, so
        # viewers see why there is no picture instead of an error.
        #
        # error_page rather than try_files: try_files does not work inside a
        # location that uses alias — a documented nginx limitation, and it
        # fails by serving the wrong path rather than by refusing to start.
        error_page 404 = @offline;
    }

    location @offline {
        alias /dev/shm/cf-live/offline/live.m3u8;
        default_type application/vnd.apple.mpegurl;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Segments are immutable once written, so they cache aggressively at the
    # edge — this is what keeps a 40 Mbps uplink from being the limit on
    # viewer count.
    location ~ ^/live/(?<stream>[A-Za-z0-9._-]+)/(?<seg>[A-Za-z0-9._-]+\.(ts|m4s))$ {
        alias /dev/shm/cf-live/$stream/$seg;
        types { } default_type video/MP2T;
        add_header Cache-Control "public, max-age=30, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # fMP4 initialisation segment, when the encoder is configured for it.
    location ~ ^/live/(?<stream>[A-Za-z0-9._-]+)/(?<init>init[A-Za-z0-9._-]*\.mp4)$ {
        alias /dev/shm/cf-live/$stream/$init;
        types { } default_type video/mp4;
        add_header Cache-Control "public, max-age=60" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # ---- offline slate ------------------------------------------------------
    location = /live/offline.ts {
        alias /dev/shm/cf-live/offline/offline.ts;
        types { } default_type video/MP2T;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # ---- static + health ----------------------------------------------------
    location = /healthz {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # The setup page, copied from the Worker build unchanged.
    location = / {
        alias /var/www/cf-live/index.html;
        default_type text/html;
        # The page embeds its own script, so a cached copy means stale player
        # logic and a reload that appears to do nothing.
        add_header Cache-Control "no-store" always;
    }
}

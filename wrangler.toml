name = "cf-live"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# One Durable Object per stream, holding that stream's segments in memory.
[[durable_objects.bindings]]
name = "LIVE_ROOM"
class_name = "LiveRoom"

# Free-plan Durable Objects must be SQLite-backed, so the class has to be
# declared with new_sqlite_classes rather than new_classes.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveRoom"]

[vars]
# Seconds per segment. Must match OBS's hls_time *and* its keyframe interval
# (frame rate x this value), or segments come out however long the keyframes
# allow and latency follows them.
SEGMENT_DURATION = "1"

# Segments advertised in the playlist. This is the dominant latency term: a
# player starts at the oldest entry, so each extra segment costs about one
# SEGMENT_DURATION of delay.
PLAYLIST_SIZE = "3"

# Segments held in memory. Raised automatically to PLAYLIST_SIZE + 1 if set
# lower. This is how far behind a viewer may drift before the segment they
# want is gone — i.e. the worst-case latency, and the tolerance for network
# jitter. The two pull in opposite directions.
MAX_SEGMENTS = "8"

# Ceiling on how many seconds the playlist may span, regardless of segment
# count. Guards latency when the encoder emits segments longer than
# SEGMENT_DURATION, which happens when its keyframe interval does not match.
MAX_WINDOW_SECONDS = "6"

# Edge cache lifetime for the offline playlist. Ingest purges the entry when a
# broadcast starts, but Cloudflare's cache is per-colo and the purge only runs
# where the ingest request landed — so this is the worst case for viewers in
# other regions before they see the stream has begun.
OFFLINE_CACHE_TTL = "3"

# Edge cache lifetime for segments. They are immutable, so this only bounds
# how long a segment lingers after falling out of the playlist.
SEGMENT_CACHE_TTL = "30"

# Terminate every playlist with ENDLIST, presenting the live window as a
# finished clip.
#
# For players that cannot follow a live playlist. Notably VRChat under Proton:
# its Media Foundation translation handles video-on-demand but not the
# continuous re-reading a live playlist needs, so a normal live stream renders
# as black video there while the same segments play with ENDLIST present.
#
# The cost is real: playback stops at the end of the buffer and does not
# resume — a player that has seen ENDLIST stops requesting anything at all,
# so the server cannot hand it more. Leave off unless you need it.
PSEUDO_VOD = "0"

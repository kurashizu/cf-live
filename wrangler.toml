name = "cf-live"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Durable Object holds the in-memory segment ring buffer for each stream.
[[durable_objects.bindings]]
name = "LIVE_ROOM"
class_name = "LiveRoom"

# Free-plan Durable Objects must be SQLite-backed, so the class has to be
# declared with new_sqlite_classes rather than new_classes.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveRoom"]

[vars]
# Segment duration in seconds. Must match OBS's hls_time.
# Lower = less latency, more requests. 1 is the practical floor.
SEGMENT_DURATION = "2"

# How many segments the DO keeps in memory. Must exceed PLAYLIST_SIZE so a
# segment referenced by the playlist is never already evicted.
MAX_SEGMENTS = "8"

# How many segments to advertise in the playlist. AVPro buffers roughly this
# many before starting, so this is the dominant latency term.
PLAYLIST_SIZE = "4"

# Hard ceiling on how many seconds the playlist may span. Protects startup
# latency when the encoder produces segments longer than SEGMENT_DURATION
# (usually a keyframe interval that does not match hls_time).
MAX_WINDOW_SECONDS = "8"

# Edge cache lifetime for the offline playlist, in seconds.
#
# Ingest purges this cache entry when a broadcast starts, but Cloudflare's
# cache is per-colo and the purge only runs where the ingest request landed, so
# viewers in other regions still wait out the TTL. Keep it short: this is the
# worst-case delay before a viewer sees the stream has begun.
OFFLINE_CACHE_TTL = "3"

# Media type for segments. "octet" serves application/octet-stream instead of
# video/mp2t; several reference streams that play correctly in AVPro use it,
# and video/mp2t appears to route some players into a demuxer path that fails.
SEGMENT_CONTENT_TYPE = "octet"

# Debug: present the live window as a finished VOD playlist.
PLAYLIST_AS_VOD = ""

# Edge cache lifetime for immutable segments, in seconds.
SEGMENT_CACHE_TTL = "30"
